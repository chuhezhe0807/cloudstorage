spring:
  application:
    name: gateway-service
  profiles:
    active: dev
  config:
    import: "optional:nacos:cloudstorage-common.yaml"
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/user/**
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=/api/files/**, /api/storage/**, /api/shares/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
    sentinel:
      transport:
        dashboard: localhost:8080

server:
  port: 8080
