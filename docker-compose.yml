# ============================================================
# CloudStorage
#   本地开发（仅基础设施）: docker compose up -d
#   全量部署（基础设施 + 前后端）: docker compose --profile app up -d --build
# 前端入口: http://localhost  (Nginx: 静态资源 + /api 反代网关)
# ============================================================

x-backend-env: &backend-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudstorage
  SPRING_DATASOURCE_USERNAME: cloudstorage
  SPRING_DATASOURCE_PASSWORD: cloudstorage123
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: redis123
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: cloudstorage
  SPRING_RABBITMQ_PASSWORD: cloudstorage123
  SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
  SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
  JWT_SECRET: cloudstorage-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Shanghai"

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile
  args:
    MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-21}
    JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"
      - "9848:9848"
    volumes:
      - ./data/nacos:/home/nacos/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_DB: cloudstorage
      POSTGRES_USER: cloudstorage
      POSTGRES_PASSWORD: cloudstorage123
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstorage -d cloudstorage"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: cloudstorage
      RABBITMQ_DEFAULT_PASS: cloudstorage123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"

  # ==================== 后端服务 ====================
  gateway-service:
    image: cloudstorage-backend:latest
    build: *backend-build
    container_name: gateway-service
    profiles: ["app"]
    environment:
      <<: *backend-env
      SERVICE: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  user-service:
    image: cloudstorage-backend:latest
    build: *backend-build
    container_name: user-service
    profiles: ["app"]
    environment:
      <<: *backend-env
      SERVICE: user-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  core-service:
    image: cloudstorage-backend:latest
    build: *backend-build
    container_name: core-service
    profiles: ["app"]
    environment:
      <<: *backend-env
      SERVICE: core-service
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: cloudstorage
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      nacos:
        condition: service_started
    restart: unless-stopped

  notification-service:
    image: cloudstorage-backend:latest
    build: *backend-build
    container_name: notification-service
    profiles: ["app"]
    environment:
      <<: *backend-env
      SERVICE: notification-service
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: unless-stopped

  # ==================== 前端 (Nginx) ====================
  frontend:
    image: cloudstorage-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "80:80"
    profiles: ["app"]
    depends_on:
      - gateway-service
    restart: unless-stopped
