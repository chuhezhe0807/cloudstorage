spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/cloudstorage
    username: cloudstorage
    password: cloudstorage123
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: redis123
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: cloudstorage
    password: cloudstorage123

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: cloudstorage

jwt:
  secret: cloudstorage-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-ttl: 900000
  refresh-token-ttl: 604800000

spring.cloud.sentinel.transport.dashboard: localhost:9080

logging:
  level:
    com.chuhezhe: DEBUG

llm:
  provider: openai
  base-url: https://api.openai.com/v1
  api-key: ${LLM_API_KEY:changeme}
  chat-model: gpt-4o-mini
  embedding-model: text-embedding-ada-002
  embedding-dimension: 1536

langfuse:
  base-url: http://localhost:3000
  public-key: ${LANGFUSE_PUBLIC_KEY:pk-changeme}
  secret-key: ${LANGFUSE_SECRET_KEY:sk-changeme}
